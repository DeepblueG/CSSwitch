name: Build CSSwitch Windows

on:
workflow_dispatch:

push:
branches:
- main

permissions:
contents: read

env:
APP_DIR: desktop
NODE_VERSION: "20"

jobs:
build-windows:
name: Build Windows x64
runs-on: windows-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: ${{ env.NODE_VERSION }}
      cache: npm
      cache-dependency-path: desktop/package-lock.json

  - name: Setup Rust
    uses: dtolnay/rust-toolchain@stable
    with:
      targets: x86_64-pc-windows-msvc

  - name: Cache Rust
    uses: Swatinem/rust-cache@v2
    with:
      workspaces: |
        desktop/src-tauri -> target

  - name: Install npm dependencies
    working-directory: desktop
    run: npm ci

  - name: Check environment
    shell: pwsh
    run: |
      Write-Host "Node:"
      node --version

      Write-Host "npm:"
      npm --version

      Write-Host "Rust:"
      rustc --version

      Write-Host "Cargo:"
      cargo --version

      Write-Host "Tauri:"
      cd desktop
      npx tauri --version

  - name: Clean bundle resources
    shell: bash
    working-directory: desktop
    run: |
      ../scripts/clean-bundle-resources.sh

  - name: Build Tauri Windows
    working-directory: desktop
    run: |
      npx tauri build --target x86_64-pc-windows-msvc

  - name: Inspect build output
    if: always()
    shell: pwsh
    run: |
      Write-Host "========================================"
      Write-Host "Tauri target directory"
      Write-Host "========================================"

      $targetDir = "desktop/src-tauri/target"

      if (Test-Path $targetDir) {
          Get-ChildItem `
            -Path $targetDir `
            -Recurse `
            -File |
            Select-Object FullName, Length
      }
      else {
          Write-Host "Target directory does not exist."
      }

  - name: Find installers
    if: success()
    shell: pwsh
    run: |
      $bundleDir = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"

      Write-Host "Bundle directory:"
      Write-Host $bundleDir

      if (-not (Test-Path $bundleDir)) {
          Write-Error "Bundle directory not found."
          exit 1
      }

      Write-Host ""
      Write-Host "Generated files:"
      Get-ChildItem `
        -Path $bundleDir `
        -Recurse `
        -File |
        Select-Object FullName, Length

      $installers = Get-ChildItem `
        -Path $bundleDir `
        -Recurse `
        -File |
        Where-Object {
            $_.Extension -eq ".exe" -or
            $_.Extension -eq ".msi"
        }

      if ($installers.Count -eq 0) {
          Write-Error "No Windows installer was generated."
          exit 1
      }

      Write-Host ""
      Write-Host "Windows installers:"
      $installers |
        Select-Object FullName, Length

  - name: Generate SHA256
    if: success()
    shell: pwsh
    run: |
      $bundleDir = "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"

      $files = Get-ChildItem `
        -Path $bundleDir `
        -Recurse `
        -File |
        Where-Object {
            $_.Extension -eq ".exe" -or
            $_.Extension -eq ".msi"
        }

      if ($files.Count -eq 0) {
          Write-Error "No EXE or MSI files found."
          exit 1
      }

      $hashFile = Join-Path $bundleDir "SHA256SUMS.txt"

      if (Test-Path $hashFile) {
          Remove-Item $hashFile -Force
      }

      foreach ($file in $files) {
          $hash = (
            Get-FileHash `
              -Algorithm SHA256 `
              -Path $file.FullName
          ).Hash.ToLower()

          "$hash  $($file.Name)" |
            Out-File `
              -FilePath $hashFile `
              -Append `
              -Encoding utf8
      }

      Write-Host ""
      Write-Host "SHA256SUMS:"
      Get-Content $hashFile

  - name: Upload Windows installers
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: CSSwitch-Windows-x64
      path: |
        desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
        desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
        desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/SHA256SUMS.txt
      if-no-files-found: error
      retention-days: 30

  - name: Upload debug build
    if: failure()
    uses: actions/upload-artifact@v4
    with:
      name: CSSwitch-Windows-debug
      path: |
        desktop/src-tauri/target/**
      if-no-files-found: ignore
      retention-days: 7
